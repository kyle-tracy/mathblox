<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeraphi</title>
<style>
  body { margin: 0; background: #2b2d42; color: #f4efe4; font: 18px system-ui, sans-serif; display: grid; justify-content: center; justify-items: center; align-items: start; gap: 12px; padding: 16px; }
  h1 { margin: 0; font-size: 22px; }
  canvas { border-radius: 10px; touch-action: none; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  /* wide screens: buttons beside the board so tall levels fit without scrolling (render/state.js fit() matches this query) */
  @media (min-aspect-ratio: 5/4) {
    body { grid-template-columns: auto auto; }
    h1 { grid-column: 1 / 3; }
    .bar { display: grid; grid-template-columns: 56px 56px; align-content: start; }
    #cast { grid-column: 1 / 3; max-width: 122px; }
  }
  #motion[aria-pressed="true"] { background: #ffd166; }
  button { min-width: 56px; min-height: 56px; font-size: 26px; border: 0; border-radius: 12px; background: #8ecae6; color: #2b2d42; cursor: pointer; }
  button:focus-visible { outline: 4px solid #ffd166; }
  #next { background: #06d6a0; }
  #cast { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; flex-basis: 100%; }
  #cast[hidden], #card[hidden] { display: none; }
  #cast canvas { border-radius: 10px; background: #f4efe4; opacity: 0.6; }
  #cast canvas.on { opacity: 1; outline: 3px solid #ffd166; outline-offset: 2px; }
  #cast small { flex-basis: 100%; text-align: center; font-size: 13px; opacity: 0.8; }
  #swap { background: #ffd166; }
  #card { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: #1d1f2ecc; padding: 16px; }
  #card > div { max-width: 420px; background: #f4efe4; color: #1d1f2e; border-radius: 16px; border-top: 12px solid var(--c); padding: 16px 24px 20px; text-align: center; cursor: pointer; }
  #card h2 { margin: 4px 0; color: var(--c); font-size: 28px; }
  #card .move { font-size: 20px; font-weight: bold; margin: 6px 0; }
  #card .trivia { font-size: 16px; line-height: 1.45; margin: 10px 0; }
  #card small { opacity: 0.6; }
  #mute.off { background: linear-gradient(to top right, #8ecae6 45%, #2b2d42 46% 54%, #8ecae6 55%); }
  /* title screen (render/title.js): the canvas is the backdrop, the choices sit on top */
  body.title > :not(#c, #title, script) { display: none; }
  body.title #c { position: fixed; inset: 0; border-radius: 0; }
  #title { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 28px; padding: 16px; }
  #title h1 { font: bold clamp(56px, 13vw, 128px) Verdana, "DejaVu Sans", sans-serif; color: #ffd166; text-shadow: 0 6px 0 #1d1f2e; }
  #title div { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  #title button { width: 260px; padding: 18px; font-size: 28px; font-weight: bold; display: grid; gap: 6px; border: 6px solid transparent; }
  #title button svg { width: 72px; height: 72px; justify-self: center; }
  #title button small { font-size: 17px; font-weight: normal; }
  #title button.pick { background: #ffd166; border-color: #f4efe4; transform: scale(1.06); }
  #title button:focus-visible { outline: 6px solid #06d6a0; outline-offset: 4px; }
</style>
</head>
<body>
<h1 id="name">Zeraphi</h1>
<canvas id="c"></canvas>
<div class="bar">
  <div id="cast" role="status" hidden></div>
  <button data-dir="left" aria-label="left">←</button>
  <button data-dir="up" aria-label="up">↑</button>
  <button data-dir="down" aria-label="down">↓</button>
  <button data-dir="right" aria-label="right">→</button>
  <button id="swap" aria-label="swap character" title="swap character (Tab / Space)" hidden>⇄</button>
  <button id="undo" aria-label="undo">↶</button>
  <button id="restart" aria-label="restart">⟳</button>
  <button id="mute" aria-label="mute" aria-pressed="false">♪</button>
  <button id="motion" aria-label="reduce motion" aria-pressed="false" title="reduce motion">∿</button>
  <button id="next" aria-label="next level" hidden>★→</button>
  <button id="map" style="font-size:16px" aria-label="back to the map" title="back to the map (Esc)" hidden>↩ map</button>
</div>
<div id="card" role="dialog" aria-label="new character" hidden><div>
  <canvas width="160" height="160"></canvas>
  <h2></h2><p class="move"></p><p class="trivia"></p><small>press any key or tap</small>
</div></div>
<script type="module" src="game.js"></script>
</body>
</html>
